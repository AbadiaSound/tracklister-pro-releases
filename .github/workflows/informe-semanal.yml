# Va en el repositorio tracklister-pro-releases, en la ruta .github/workflows/informe-semanal.yml
# Cada lunes envía a Telegram el número de descargas del instalador.
name: Informe semanal de descargas

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - name: Contar descargas y enviar a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          curl -s "https://api.github.com/repos/$REPO/releases" -o releases.json
          DESCARGAS=$(python3 -c "import json; r=json.load(open('releases.json')); print(sum(a.get('download_count',0) for x in r for a in x.get('assets',[])))")
          echo "Descargas: $DESCARGAS"
          TOKEN=$(echo "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')
          CHAT=$(echo "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')
          TEXTO="📦 Informe semanal Tracklister PRO
          Descargas totales del instalador: $DESCARGAS"
          RESPUESTA=$(curl -s "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXTO}")
          echo "Respuesta de Telegram: $RESPUESTA"
