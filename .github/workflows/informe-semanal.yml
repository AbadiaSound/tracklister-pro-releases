# Va en el repositorio tracklister-pro-releases, en la ruta .github/workflows/informe-semanal.yml
# Cada lunes envía a Telegram el número de descargas del instalador.
# Las claves se guardan en GitHub: Settings → Secrets and variables → Actions.
name: Informe semanal de descargas

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - name: Contar descargas y enviar a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          DESCARGAS=$(curl -s "https://api.github.com/repos/$REPO/releases" | jq '[.[].assets[].download_count] | add // 0')
          TEXTO="📦 Informe semanal Tracklister PRO
          Descargas totales del instalador: $DESCARGAS"
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXTO}"
